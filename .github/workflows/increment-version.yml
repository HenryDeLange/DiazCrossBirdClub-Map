name: Increment Version

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-24.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7
      - name: Bump Patch Version
        uses: phips28/gh-action-bump-version@master
        with:
          version-type: patch
          skip-tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
